domains:
  - name: 'Using MDX UI components'
    slug: 'using-mdx-ui'
    description: 'Authoring MDX documentation with interactive components — understanding how Markdown content maps to component slots, which components are available, and how to configure them.'

skills:
  - name: 'Using MDX UI'
    slug: 'using-mdx-ui'
    domain: 'using-mdx-ui'
    description: 'Add interactive UI components (tabs, accordions, cards, popovers, callouts) to MDX documentation files using only Markdown syntax.'
    type: 'core'
    packages:
      - '@tobeofuse/mdx-ui'
    covers:
      - 'MdxTabs'
      - 'MdxAccordion'
      - 'MdxInfo'
      - 'MdxWarning'
      - 'MdxCard'
      - 'MdxCardSet'
      - 'MdxPopover'
      - 'Child slot pattern (React.Children inspection)'
      - 'Divider syntax: --- (hr) and # (h1)'
      - 'Blank line requirements in MDX'
      - 'defaultOpen prop'
      - 'CSS / dark mode setup'
      - 'Astro integration'
    tasks:
      - 'Wrap a section of content in a tabbed interface'
      - 'Add a collapsible accordion section'
      - 'Display an info or warning callout box'
      - 'Present content in a card or horizontal card set'
      - 'Add a popover tooltip or aside to a term'
      - 'Make documentation more visually interesting than plain text'
      - 'Set up the library in an Astro or React project'
    failure_modes:
      - mistake: 'Adding JSX props to configure component content'
        mechanism: >
          Components derive all structure from child elements — there are no
          content props. Agents accustomed to prop-driven APIs add props like
          label="..." or title="..." that are silently ignored, producing
          components with no visible label or header.
        wrong_pattern: |
          <MdxAccordion label="What is MDX?">

          MDX lets you write JSX inside Markdown.

          </MdxAccordion>
        correct_pattern: |
          <MdxAccordion>

          What is MDX?

          ---

          MDX lets you write JSX inside Markdown.

          </MdxAccordion>
        source: 'maintainer interview'
        priority: 'CRITICAL'
        status: 'active'
        version_context: 'Applies to all versions — components have never accepted content props'

      - mistake: 'Omitting blank lines between child elements in MDX'
        mechanism: >
          MDX only generates separate React elements when content blocks are
          separated by blank lines. Without blank lines, adjacent text collapses
          into a single element, so the component's React.Children scan finds
          only one child instead of a label and content — the divider logic
          never triggers.
        wrong_pattern: |
          <MdxInfo>
          Important note
          ---
          This is the description.
          </MdxInfo>
        correct_pattern: |
          <MdxInfo>

          Important note

          ---

          This is the description.

          </MdxInfo>
        source: 'maintainer interview'
        priority: 'CRITICAL'
        status: 'active'
        version_context: 'Inherent to how MDX parses content — not version-specific'

      - mistake: 'Missing experimentalReactChildren flag in Astro'
        mechanism: >
          Astro does not pass children to React components as React elements by
          default. The React.Children slot pattern this library uses requires
          actual React elements; without the experimentalReactChildren flag,
          all components receive opaque children and render empty or broken output.
        wrong_pattern: |
          // astro.config.mjs
          import { defineConfig } from 'astro/config';
          import react from '@astrojs/react';

          export default defineConfig({
            integrations: [react()],
          });
        correct_pattern: |
          // astro.config.mjs
          import { defineConfig } from 'astro/config';
          import react from '@astrojs/react';

          export default defineConfig({
            integrations: [
              react({
                experimentalReactChildren: true,
              }),
            ],
          });
        source: 'maintainer interview'
        priority: 'CRITICAL'
        status: 'active'
        version_context: 'Required as long as Astro does not enable React children by default'

      - mistake: 'Using --- as a divider at the very start of an MDX file'
        mechanism: >
          In MDX (and Markdown), --- at the very beginning of a file is parsed
          as YAML frontmatter, not an <hr> element. A component placed before
          any other content that relies on --- as a divider will silently receive
          no structural break.
        wrong_pattern: |
          ---
          title: My Doc
          ---

          <MdxTabs>
          ---
          Tab A
          ---
          Tab B
          </MdxTabs>
        correct_pattern: |
          ---
          title: My Doc
          ---

          <MdxTabs>

          # Tab A

          Content for Tab A.

          # Tab B

          Content for Tab B.

          </MdxTabs>
        source: 'MDX / Markdown spec; maintainer interview'
        priority: 'HIGH'
        status: 'active'
        version_context: 'Standard Markdown/MDX behavior — not version-specific'

      - mistake: 'Using multiple MdxCard instances instead of MdxCardSet for horizontal layout'
        mechanism: >
          MdxCardSet renders multiple cards in a horizontally scrollable row.
          Placing individual MdxCard components side-by-side does not produce
          this layout — they stack vertically and lack the shared scroll container.
        wrong_pattern: |
          <MdxCard>

          Card One

          ---

          Content for card one.

          </MdxCard>

          <MdxCard>

          Card Two

          ---

          Content for card two.

          </MdxCard>
        correct_pattern: |
          <MdxCardSet>

          # Card One

          Content for card one.

          # Card Two

          Content for card two.

          </MdxCardSet>
        source: 'source: lib/components/MdxCard.tsx'
        priority: 'MEDIUM'
        status: 'active'
        version_context: 'Applies to all versions'

      - mistake: 'Not adding a dark class ancestor for dark mode'
        mechanism: >
          Dark mode is opt-in and requires an ancestor element to have the
          class "dark". Without it, components always render in light mode
          regardless of OS or app-level dark mode settings.
        wrong_pattern: |
          // No .dark ancestor — components always render light
          <div>
            <MdxInfo>Note</MdxInfo>
          </div>
        correct_pattern: |
          // Add .dark to a wrapping element (e.g. <html> or a layout root)
          <div class="dark">
            <MdxInfo>Note</MdxInfo>
          </div>
        source: 'Readme.md; maintainer interview'
        priority: 'MEDIUM'
        status: 'active'
        version_context: 'Applies to all versions'

